<div class="page p0">
  
  <div class="p0-cadre"></div>
  
  <div class="p0-coin p0-coin-tl"></div>
  <div class="p0-coin p0-coin-tr"></div>
  <div class="p0-coin p0-coin-bl"></div>
  <div class="p0-coin p0-coin-br"></div>
  
  <p class="p0-ornament-top">✦ ✦ ✦</p>
  
  <div class="p0-content">
    
    <p class="p0-surtitle">Bienvenue dans ton histoire</p>
    
    <h1 class="p0-titre">Ce Jour-Là</h1>
    
    <p class="p0-date">{{DATE_COMPLETE_FR}}</p>
    
    <div class="p0-ligne"></div>
    
    <p class="p0-prenom">{{PRENOM}}</p>
    
    <div class="p0-qr-zone">
      <p class="p0-qr-intro">Avant de tourner la page, ouvre ce portail...</p>
      <div class="p0-qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{URL_PLAYLIST}}" alt="">
      </div>
      <p class="p0-qr-text">Ferme les yeux. Écoute. Tu y es.</p>
    </div>
    
  </div>
  
  <p class="p0-ornament-bottom">✦ ✦ ✦</p>
  
</div>
