<div class="page p-instant">
  
  <div class="pi-header">
    <p class="pi-ornament">✦ ✦ ✦</p>
    <h1 class="pi-titre">Instant Volé</h1>
    <p class="pi-subtitle">Un moment qui te définit</p>
    <div class="pi-sep"></div>
  </div>
  
  <div class="pi-body">
    
    <div class="pi-scene">
      <span class="pi-quote-open">❝</span>
      <p class="pi-anecdote">{{ANECDOTE}}</p>
      <p class="pi-punchline">{{PUNCHLINE}}</p>
      <span class="pi-quote-close">❞</span>
    </div>
    
    <div class="pi-context">
      <div class="pi-context-icon">
        <i class="fa-solid fa-clapperboard"></i>
      </div>
      <div class="pi-context-content">
        <p class="pi-context-label">La scène</p>
        <p class="pi-context-txt">{{CONTEXTE}}</p>
      </div>
    </div>
    
    <div class="pi-tags">
      <div class="pi-tag pi-tag-type">
        <i class="fa-solid fa-{{ICONE_TYPE}}"></i>
        <span>{{TYPE_MOMENT}}</span>
      </div>
      <div class="pi-tag pi-tag-temoin">
        <i class="fa-solid fa-heart"></i>
        <span>Raconté par {{TEMOIN}}</span>
      </div>
    </div>
    
  </div>
  
  <div class="pi-footer"> 
    <p class="pi-ornament-footer">— ✦ —</p>
    <p class="pi-citation">« {{PHRASE_CONCLUSION}} »</p>
  </div>
  
  <p class="pi-num">{{NUM_PAGE}}</p>
  
</div>
